name: Textbook quality checks
on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'index.html'
      - '.github/workflows/textbook-check.yml'
  pull_request:
    paths:
      - 'notes/**'
      - 'index.html'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Verify textbook structure and calculations
        run: |
          node notes/test.mjs
          node --check notes/notes.js
