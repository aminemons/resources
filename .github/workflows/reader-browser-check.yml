name: Reader math and visual smoke tests
on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - '.github/workflows/reader-browser-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v4.4.0
        with:
          node-version: '22'
      - name: Install browser and JS test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Serve static notes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory notes >/tmp/notes-http.log 2>&1 &
          echo $! >/tmp/notes-http.pid
      - name: Verify LaTeX and mobile reader
        run: node notes/math-browser-test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reader-screenshots
          path: notes-*.png
          if-no-files-found: ignore
