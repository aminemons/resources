name: Weekly resource link audit
on:
  schedule:
    - cron: '17 6 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_links.py'
      - '.github/workflows/resource-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resources-link-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Inspect resource links
        run: python scripts/audit_links.py
      - name: Commit current report without racing catalogue updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-health.json
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "audit: weekly resource URL availability"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Audit report update conflicts with other edits; rerun safely"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Audit report committed"
              exit 0
            fi
            echo "Retrying push after competing repository update"
            sleep 3
          done
          echo "Could not publish audit after retries"
          exit 1
