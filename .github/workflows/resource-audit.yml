name: Weekly resource link audit
on:
  schedule:
    - cron: '17 6 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_links.py'
      - 'data/resources.json'
      - '.github/workflows/resource-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resource-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check public provider links
        run: python scripts/audit_links.py
      - name: Commit audit when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly provider link audit"
            git push
          fi
